<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Top Jugadores - Ara Macao Memory</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'memgame/css/style.css' %}">

    <style>
        :root {
            --jade-dark: #0A1F14;
            --jade-medium: #1B4332;
            --maya-gold: #D4AF37;
            --jungle-green: #2D6A4F;
            --pergamino: #F4F1EA;
        }

        body {
            background-color: var(--pergamino);
            color: var(--jade-dark);
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
        }

        /* Header del ranking */
        .ranking-header {
            background: linear-gradient(135deg, var(--jade-dark) 0%, var(--jade-medium) 100%);
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(10, 31, 20, 0.3);
        }

        .ranking-header::before {
            content: "🏆";
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 150px;
            opacity: 0.1;
            pointer-events: none;
        }

        .ranking-header h1 {
            color: var(--maya-gold);
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            position: relative;
            z-index: 2;
        }

        .ranking-header p {
            color: rgba(255,255,255,0.8);
            margin: 10px 0 0;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        /* Tarjeta del ranking */
        .ranking-card {
            background: #ffffff;
            border: none;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border-top: 8px solid var(--maya-gold);
            overflow: hidden;
        }

        /* Filtros */
        .filter-section {
            background: #fff;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .filter-section h5 {
            color: var(--jade-dark);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-section h5::before {
            content: "🔍";
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--jade-medium);
            margin-bottom: 6px;
            display: block;
        }

        .form-control, .form-control-sm {
            border: 2px solid #E8E8E8;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .form-control:focus, .form-control-sm:focus {
            border-color: var(--maya-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            outline: none;
            background: #fff;
        }

        .btn-filter {
            background: var(--jade-dark);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(10, 31, 20, 0.2);
        }

        .btn-filter:hover {
            background: var(--jade-medium);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(10, 31, 20, 0.3);
        }

        .btn-clear {
            background: transparent;
            color: #DC3545;
            border: 2px solid #DC3545;
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: #DC3545;
            color: #fff;
            transform: translateY(-2px);
        }

        /* Tabla */
        .table-container {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .table {
            margin-bottom: 0;
            font-size: 0.95rem;
        }

        .table thead {
            background: var(--jade-dark);
            color: var(--maya-gold);
        }

        .table thead th {
            border: none;
            padding: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.8rem;
            vertical-align: middle;
        }

        .table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #F0F0F0;
        }

        .table tbody tr:hover {
            background: rgba(212, 175, 55, 0.08);
            transform: scale(1.01);
        }

        .table tbody tr:last-child {
            border-bottom: none;
        }

        .table td {
            padding: 16px;
            vertical-align: middle;
            color: var(--jade-dark);
        }

        .table td strong {
            color: var(--jade-dark);
            font-weight: 700;
        }

        /* Badges de rango */
        .rank-badge {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #B87333); color: #fff; }
        .rank-other { background: #E9ECEF; color: var(--jade-dark); }

        /* Badges de nivel */
        .badge-level {
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
        }

        .lvl-basico { background: #E91E63; color: #fff; box-shadow: 0 3px 8px rgba(233, 30, 99, 0.3); }
        .lvl-medio { background: #2D6A4F; color: #fff; box-shadow: 0 3px 8px rgba(45, 106, 79, 0.3); }
        .lvl-avanzado { background: #0056B3; color: #fff; box-shadow: 0 3px 8px rgba(0, 86, 179, 0.3); }

        /* Puntaje */
        .score-value {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--jungle-green);
        }

        /* Alerta */
        .leaderboard-alert {
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .alert-info { background: #E3F2FD; color: #1565C0; }
        .alert-danger { background: #FFEBEE; color: #C62828; }

        /* Estado vacío */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #888;
        }

        .empty-state h3 {
            color: var(--jade-dark);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #888;
            margin-bottom: 25px;
        }

        /* Info de resultados */
        .results-info {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 10px;
        }

        /* Botones de acción inferior */
        .btn-expedition {
            background: var(--jade-dark);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-expedition:hover {
            background: var(--jade-medium);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ranking-header {
                padding: 30px 20px;
                text-align: center;
            }
            .ranking-header h1 {
                font-size: 1.8rem;
            }
            .filter-section {
                padding: 16px;
            }
            .filter-section .col-md-3,
            .filter-section .col-md-2,
            .filter-section .col-md-1 {
                margin-bottom: 15px;
            }
            .table td, .table th {
                padding: 12px 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <div class="ranking-header animate__animated animate__fadeInDown">
            <h1>🏆 Tabla de Clasificación</h1>
            <p>Los mejores exploradores de la selva Maya</p>
        </div>

        <!-- Filtros -->
        <div class="filter-section animate__animated animate__fadeInUp">
            <h5>Filtrar Ranking</h5>
            <form id="filterForm" class="row align-items-end g-3" novalidate>
                <input type="hidden" name="limit" value="50">
                <input type="hidden" name="order" id="orderInput" value="asc">

                <div class="col-md-4 col-sm-12">
                    <label class="filter-label">Jugador</label>
                    <input type="text" name="name" class="form-control" placeholder="Buscar nombre...">
                </div>

                <div class="col-md-2 col-sm-6">
                    <label class="filter-label">Nivel</label>
                    <select name="level" class="form-control">
                        <option value="">Todos</option>
                        <option value="Básico">Básico</option>
                        <option value="Medio">Medio</option>
                        <option value="Avanzado">Avanzado</option>
                    </select>
                </div>

                <div class="col-md-2 col-sm-6">
                    <label class="filter-label">Puntaje mín.</label>
                    <input type="number" name="min_score" class="form-control" placeholder="0">
                </div>

                <div class="col-md-2 col-sm-6">
                    <label class="filter-label">Puntaje máx.</label>
                    <input type="number" name="max_score" class="form-control" placeholder="∞">
                </div>

                <div class="col-md-2 col-sm-6">
                    <label class="filter-label">Orden</label>
                    <select name="order" class="form-control">
                        <option value="asc">Menor primero (tiempo)</option>
                        <option value="desc">Mayor primero (puntos)</option>
                    </select>
                </div>

                <div class="col-md-2 col-sm-6 d-flex align-items-end">
                    <button type="button" id="applyFilters" class="btn btn-filter w-100">Filtrar</button>
                </div>
                <div class="col-md-2 col-sm-6 d-flex align-items-end">
                    <button type="button" id="clearFilters" class="btn btn-clear w-100">Limpiar</button>
                </div>
            </form>
        </div>

        <!-- Alerta -->
        <div id="leaderboard-alert" class="leaderboard-alert alert alert-info animate__animated animate__fadeIn" style="display:none;"></div>

        <!-- Tabla -->
        <div class="table-container animate__animated animate__fadeInUp">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 8%;">#</th>
                        <th style="width: 30%;">Jugador</th>
                        <th style="width: 18%;">Nivel</th>
                        <th style="width: 22%;">Puntaje / Tiempo</th>
                        <th style="width: 22%;">Detalle</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-5">
                            Cargando ranking...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <a href="{% url 'memgame:profile' %}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 50px; font-weight: 700;">
                Mi Bitácora
            </a>
            <a href="{% url 'memgame:select_level' %}" class="btn btn-expedition">
                Nueva Expedición
            </a>
            <span class="results-info" id="leaderboard-info"></span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiTopUrl = "{% url 'memgame:leaderboard_top_api' %}";

        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function levelBadge(level) {
            const cls = {
                "Básico": "lvl-basico",
                "Medio": "lvl-medio",
                "Avanzado": "lvl-avanzado",
            }[level] || "";
            return `<span class="badge-level ${cls}">${escapeHtml(level || "-")}</span>`;
        }

        function levelDetail(level) {
            return {
                "Avanzado": "Maestro Baktún 🏺",
                "Medio": "Guía de la Selva 🌿",
                "Básico": "Explorador 🌱",
            }[level] || "-";
        }

        function loadLeaderboard(params = {}) {
            const tbody = $("#leaderboard-body");
            const alert = $("#leaderboard-alert");
            const info = $("#leaderboard-info");

            alert.hide().removeClass("alert-danger alert-info").addClass("alert-info");

            $.get(apiTopUrl, params)
                .done(function(data) {
                    alert.hide();
                    tbody.empty();

                    if (!data || !data.top || data.top.length === 0) {
                        tbody.html(`
                            <tr>
                                <td colspan="5" class="empty-state">
                                    <h3>Sin resultados</h3>
                                    <p>No se encontraron coincidencias con los filtros aplicados.</p>
                                </td>
                            </tr>
                        `);
                        info.text("");
                        return;
                    }

                    data.top.forEach(function(entry, index) {
                        const rank = index + 1;
                        let rankClass = "rank-other";
                        if (rank === 1) rankClass = "rank-1";
                        else if (rank === 2) rankClass = "rank-2";
                        else if (rank === 3) rankClass = "rank-3";

                        const name = entry.name || "Desconocido";
                        const level = entry.level || "-";
                        const score = entry.score != null ? entry.score.toFixed(2) : "--";

                        const row = `
                            <tr>
                                <td>
                                    <span class="rank-badge ${rankClass}">${rank}</span>
                                </td>
                                <td>
                                    <strong>${escapeHtml(name)}</strong>
                                </td>
                                <td>${levelBadge(level)}</td>
                                <td>
                                    <span class="score-value">${score}</span>
                                    <span class="text-muted ml-1" style="font-size: 0.85rem;">s</span>
                                </td>
                                <td>
                                    <span class="text-muted small d-block">${levelDetail(level)}</span>
                                </td>
                            </tr>
                        `;
                        tbody.append(row);
                    });

                    const f = data.filters || {};
                    let infoText = `Mostrando <strong>${data.count}</strong> resultado(s)`;
                    if (f.name) infoText += ` | Jugador: "${f.name}"`;
                    if (f.level) infoText += ` | Nivel: ${f.level}`;
                    if (f.order === "desc") infoText += ` | Orden: Mayor primero`;
                    else infoText += ` | Orden: Menor primero`;
                    info.html(infoText);
                })
                .fail(function() {
                    alert.removeClass("alert-info")
                        .addClass("alert-danger")
                        .text("No se pudo cargar el ranking. Intenta nuevamente más tarde.")
                        .show();
                    tbody.html(`
                        <tr>
                            <td colspan="5" class="text-center text-danger py-5">
                                Error al cargar el ranking.
                            </td>
                        </tr>
                    `);
                });
        }

        $(document).ready(function() {
            loadLeaderboard({ limit: 50, order: "asc" });

            $("#applyFilters").click(function(e) {
                e.preventDefault();
                const form = $("#filterForm");
                const params = {};
                form.serializeArray().forEach(function(item) {
                    if (item.value !== "") params[item.name] = item.value;
                });
                loadLeaderboard(params);
            });

            $("#clearFilters").click(function(e) {
                e.preventDefault();
                $("#filterForm")[0].reset();
                $("#orderInput").val("asc");
                loadLeaderboard({ limit: 50, order: "asc" });
            });
        });
    </script>
</body>
</html>
